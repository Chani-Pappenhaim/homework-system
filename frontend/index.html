<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Notebook type stack (all carry Hebrew glyphs):
      - Frank Ruhl Libre : display serif — headings, big numbers, brand mark.
      - Rubik            : body sans — UI text, labels, buttons (ss01/cv01 on).
      - Space Mono       : mono — numerics, tags, kbd, "01/06" counters, meta.
      Heebo stays as the last Hebrew fallback so nothing renders in Arial.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Heebo:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>מסד · מערכת הגשת שיעורי בית</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
